[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "raccoon-bench"
version = "0.1.0"
description = "Raccoon: a benchmark for prompt extraction attacks on LLM-integrated applications"
readme = "README.md"
requires-python = ">=3.9"
license-files = ["LICENSE"]
dependencies = ["tiktoken>=0.5.2"]

[project.optional-dependencies]
# Needed by Raccoon.raccoon, Raccoon.raccoon_gang, Raccoon.utils and run_raccoon_gang.py.
bench = [
    "google-generativeai>=0.3.2",
    "httpx>=0.26.0",
    "openai>=1.10.0",
    "ratelimit>=2.2.1",
    "rouge-score>=0.1.2",
    "tqdm>=4.66.1",
]

[project.urls]
Repository = "https://github.com/M0gician/RaccoonBench"

[tool.hatch.build.targets.wheel]
packages = ["Raccoon"]

[tool.hatch.build.targets.sdist]
include = ["/Raccoon", "/LICENSE", "/README.md", "/pyproject.toml"]
